---
version: 2
updates:
  - package-ecosystem: gomod
    commit-message:
      prefix: "CHORE"
    directory: /
    schedule:
      interval: monthly
    groups:
      prod:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      prod:
        patterns:
          - "*"
